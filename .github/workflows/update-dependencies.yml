name: Update Dependencies

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Update Go and dependencies
        run: |
          go get go@latest
          go get -u ./...
          go mod tidy

      - name: Check for changes
        id: verify-changed-files
        run: |
          if git diff --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Create branch and commit
        if: steps.verify-changed-files.outputs.changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git checkout -b chore/update-dependencies
          git add go.mod go.sum
          git commit -m "chore: update Go dependencies"
          git push origin chore/update-dependencies --force

      - name: Create Pull Request
        if: steps.verify-changed-files.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > /tmp/pr_body.txt << 'EOF'
          Automated Dependency Update

          This PR updates Go dependencies to their latest versions using:
          - go get go@latest
          - go get -u ./...
          - go mod tidy

          Please review and merge if the changes look good.
          EOF
          gh pr create \
            --title "chore: update Go dependencies" \
            --body-file /tmp/pr_body.txt \
            --base main \
            --head chore/update-dependencies
